name: PR Preview (jsDelivr)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  post-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Post jsDelivr preview link to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('No pull_request payload found; skipping preview comment.');
            } else {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const branch = encodeURIComponent(pr.head.ref);
              const path = 'index.html';
              const url = `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/${path}`;
              const body = `Preview HTML (jsDelivr): ${url}\n\nThis uses the PR branch directly and is compatible with branch names that include slashes.`;
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
