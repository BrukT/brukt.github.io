name: PR Preview (raw.githack)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  post-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Post raw.githack preview link to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;
            const path = 'cv.html';
            const url = `https://raw.githack.com/${owner}/${repo}/${branch}/${path}`;
            const body = `Preview HTML (raw.githack): ${url}\n\nNote: raw.githack serves the branch HTML directly. If your page depends on Jekyll processing, configure Pages or use the Pages preview action.`;
            await github.issues.createComment({ owner, repo, issue_number: context.payload.pull_request.number, body });
